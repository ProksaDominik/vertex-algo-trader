# YOLO Portfolio — aggressive personal $200 account, NETTING-mode compatible.
#
# One config per pair (netting rule). 6 pairs = 6 concurrent signal streams
# = ~7-10 trades/day realistically.
#
# tp_r_multiple is now PER-SLOT, not one blanket ratio — chosen by a sweep
# (2026-07-15) that tried candidates from 0.2 to 5.0 against each slot's own
# trade history and kept whichever ratio gave the best net expectancy. Every
# slot here is a low-win-rate breakout/trend strategy (20-33% WR is normal
# for Donchian/MACD) — that shape needs a LARGE reward:risk to be net
# profitable, which is why the sweep converged on wide TPs (3-5x the SL
# distance) for every slot. A ratchet trailing stop (below) now handles
# closing trades sooner on a pullback instead of a tight fixed TP.
# Skyrocket-exit (below) applies on top: an outsized favorable candle closes
# the trade early rather than waiting for the full TP target.
#
# NO KILL SWITCH by design — this is aggressive mode. If the account goes to zero,
# that's what you signed up for by picking YOLO over FTMO.

capital:
  # $30/trade = 15% of $200. Extremely aggressive.
  risk_usd_per_trade: 30

  # Ratchet trailing stop DISABLED (2026-07-17): it was tuned (0.15R start)
  # for the old 0.333R TP, where a trade had little room to run anyway. Now
  # that tp_r_multiple is 0.75 — specifically widened because the backtest
  # showed bigger targets meaningfully improve P&L — a 0.15R ratchet closes
  # trades on the first small pullback long before they get anywhere near
  # that target, which directly defeats the point of widening it. The
  # wider-TP result itself was measured WITHOUT a ratchet in the backtest,
  # so running both together live was never actually validated, and it
  # visibly wasn't working right (trades closing at a couple dollars of
  # profit with TP several times further away). 0 disables it.
  trail_start_r: 0.0
  trail_lock_fraction: 0.5

  # Close early (at market) when the current candle's range is >= 2.5x the
  # recent (20-bar) average range, moving favorably, and the trade is in
  # profit — captures an outsized spike instead of waiting for the (often
  # distant) fixed TP or letting a big move round-trip back down before it
  # triggers.
  skyrocket_multiple: 2.5

  # Set very deep so kill-switch checks never trip in YOLO mode.
  daily_stop_loss_usd: -10000
  max_total_drawdown_usd: -10000

  max_positions_per_config: 5      # raised from 3 so more concurrent trades can fire per slot

configs:
  # 1. XAUUSD — 78.4% WR (highest in whole sweep), 2.55 trades/day.
  #    Tightest TP for the win-rate feel.
  - name: yolo_xauusd_donchian_30m_03r
    symbol: XAUUSD
    strategy: DonchianBreakout
    timeframe: 30m
    magic_number: 3001
    strategy_params:
      donchian:
        period: 10  # tightened from 20 so SL/TP sit closer to entry, per explicit request
      exit:
        tp_r_multiple: 0.75  # widened from 0.333 (2026-07-17 sweep): calibrated to land near ~13 trades/day (your stated target) while still capturing a real chunk of the P&L improvement a wider target showed in backtest.

