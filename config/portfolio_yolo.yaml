# YOLO $200 portfolio -- rebuilt 2026-08-05.
#
# TWO UNCORRELATED STREAMS. No deadline and no drawdown rules here, so unlike
# the FTMO book this one is scored on GROWTH and keeps the WIDE targets that
# maximise expectancy rather than the tight ones that win races.
#
#   1. FX MEAN-REVERSION @4R -- RSI(14) + Bollinger(20,2.0) on 17 pairs.
#      OOS +0.385R and +0.153R, both halves positive.
#   2. NON-FX TREND @6R -- Donchian(20) on indices/commodities/crypto.
#      +0.219R train / +0.340R OOS: the most robust single result in this
#      project, 5x RSI's train half, and it does NOT lean on the post-2021
#      regime the FX edge depends on (scripts/nonfx_trend_test.py).
#
# The streams are essentially UNCORRELATED (+0.047 daily). Blending cut
# portfolio volatility 35% (sigma 2.61 -> 1.69) while RAISING mu/sigma above
# either stream alone -- the only time in this project that cutting variance
# did not cut drift with it, because these bets are genuinely independent (the
# 17-pair FX basket is worth only ~4.9).
#
# That diversification did NOT help the FTMO book (two-stream 38.1%/42.3% vs
# FX-only 39.1%/42.9%, scripts/two_stream_race.py): a deadline rewards speed
# over smoothness. Here, where compounding runs indefinitely, it is exactly
# what you want.
#
# ADAPTIVE LAYER DISABLED -- measured harmful, it benched the BEST trades
# (scripts/learner_value_test.py: kept +0.052R vs benched +0.309R).
#
# COST WARNING: PAIR_SPECS spreads for the non-FX instruments are ESTIMATES
# (several returned zero ticks when queried live). Costs are the binding
# constraint in this project, so the Donchian numbers are PROVISIONAL until
# verified against real fills. BRENT/COPPER excluded -- profitable in
# backtest but this broker does not offer them.
#
# SIZING: 15% risk, 10 concurrent -- the most profitable AND most aggressive
# setting measured (scripts/yolo_roster_compare.py), median month +5.66%.
#
# THREE legs, not more. Adding RSI(7)+Boll(40) doubles trades/day (1.09 ->
# 2.34) but CUTS the median month from +5.66% to +1.03%; a 7-leg roster turns
# it NEGATIVE (-4.19%). RSI(14) earns +0.463R OOS while RSI(7) earns +0.151R,
# so extra legs buy frequency by diluting quality. Concentration wins here.
#
# P(ruin) is 9.2% at this sizing. That is the price of the aggression and it
# is deliberate on a paper book; drop to 10% risk for 3.6% ruin and a +3.77%
# median month.
#
# CURRENCY CAP REMOVED (max_currency_exposure_r: 0), deliberately.
#
# The cap exists because the 17-pair FX basket is only ~4.9 independent bets:
# on 2026-07-15 seventeen live positions decomposed to roughly ONE bet (long
# CHF / short JPY) and returned +$374; six days later the same structure
# returned -$832. That episode is why the cap was added.
#
# Measured over 10.5y, however, concentration WINS on this book
# (scripts scratchpad capcmp, $200 / 15% risk / 10 concurrent):
#
#   cap    med wk   med month   P(+$150 wk)   P(ruin)   maxDD
#     2    -0.43%     +5.66%        6.0%        9.2%    23.4%
#     1    -0.34%     +2.88%        0.9%        2.8%    16.6%
#  none    +4.76%    +20.29%       14.2%       16.7%    32.8%
#
# Removing it nearly QUADRUPLES the median month and turns the median week
# positive. The reason: correlated positions amplify both directions, and
# this book has positive expectancy, so amplifying it gains more than the
# extra ruin risk costs -- the single-sample intuition from July was wrong.
#
# The price is real and accepted: ruin 9.2% -> 16.7%, max drawdown
# 23.4% -> 32.8%. On a $200 PAPER book that is an information cost, not a
# financial one. Do NOT copy this setting to the FTMO book, where a 10%
# drawdown ends the account outright.
#
# COST GATE RAISED 0.04 -> 0.10.
#
# At 0.04 the live book rejected 4 of its 6 signals in four days
# (AUDUSD 0.067R and 0.042R, AUDCAD 0.050R, EURCHF 0.075R). That threshold was
# copied from the FTMO book, where trades are 1R-target confluence entries
# with tight stops so cost is naturally a small fraction of R. THIS book runs
# 4-6R targets on wide daily swing stops, where a legitimate trade routinely
# costs 0.04-0.08R -- the gate was filtering out normal trades, not bad ones.
#
# 0.10 still blocks the genuinely uneconomic ones. Keep an eye on it via the
# nightly review: if real slippage runs at the 2-12x seen in July, the honest
# response is to trade fewer instruments, not to keep loosening this.
#
# Paper/demo only (MetaQuotes-Demo).

capital:
  risk_mode: percent_equity
  risk_pct: 15.0
  account_size_usd: 200
  risk_usd_per_trade: 30
  trail_start_r: 0.0
  trail_lock_fraction: 0.0
  daily_stop_loss_usd: -40
  max_total_drawdown_usd: -120
  max_positions_per_config: 2
  max_total_open_risk_r: 10
  max_concurrent_positions_total: 10
  max_currency_exposure_r: 0.0
  max_signal_age_bars: 2
  min_lot_policy: floor
  skip_weekdays:
  - 6
  max_trades_per_day: 8
  weekly_stop_pct: 0.0
  k4_consecutive_loss_halving_enabled: false
  k4_consecutive_loss_trigger: 4
  k4_recovery_wins_needed: 2
  k6_spread_anomaly_enabled: true
  k6_spread_multiple: 5.0
  k6_persist_s: 30.0
  k8_slippage_recalibration_enabled: true
  k8_window_trades: 20
  k8_slippage_multiple: 2.0
  k9_ntp_drift_enabled: true
  k9_max_drift_s: 5.0
  k9_check_interval_s: 300.0
  k10_lot_anomaly_enabled: true
  k10_window_trades: 20
  k10_lot_multiple: 3.0
  cost_gate_enabled: true
  cost_gate_r: 0.1
  slot_health:
    enabled: false
    window_trades: 12
    quarantine_below_net_r: -8.0
    cooldown_hours: 12
  learning:
    enabled: false
    session_min_trades: 6
    session_avoid_below_net_r: -3.0
  auto_retune:
    enabled: true
    step_pct: 0.2
    floor_frac: 0.3
    max_retunes: 5
  circuit_breaker:
    enabled: true
    halt_drawdown_pct: 40
  partial_take:
    enabled: false
  pyramid:
    enabled: false
configs:
- name: RSI_Daily
  strategy: RSIReversion
  timeframe: 1d
  magic_base: 7100
  symbols: &id001
  - EURUSD
  - GBPUSD
  - USDJPY
  - AUDUSD
  - USDCAD
  - USDCHF
  - NZDUSD
  - EURJPY
  - GBPJPY
  - NZDJPY
  - AUDJPY
  - CHFJPY
  - GBPCHF
  - EURCHF
  - AUDCHF
  - EURAUD
  - AUDCAD
  strategy_params:
    rsi:
      period: 14
      oversold: 30
      overbought: 70
    exit:
      tp_r_multiple: 4.0
      sl_swing_lookback: 10
      trail_start_r: 0.0
- name: Bollinger_Daily
  strategy: BollingerBounce
  timeframe: 1d
  magic_base: 7300
  symbols: *id001
  strategy_params:
    bollinger:
      period: 20
      std_dev: 2.0
    exit:
      tp_r_multiple: 4.0
      sl_swing_lookback: 10
      trail_start_r: 0.0
- name: Donchian_Trend
  strategy: DonchianBreakout
  timeframe: 1d
  magic_base: 7900
  symbols:
  - US30
  - NAS100
  - DE40
  - JP225
  - WTI
  - XPTUSD
  - BTCUSD
  - ETHUSD
  - XAUUSD
  - US500
  strategy_params:
    donchian:
      period: 20
    exit:
      tp_r_multiple: 6.0
      sl_swing_lookback: 10
      trail_start_r: 0.0
watchdog:
  enabled: true
  stale_tick_s: 300
mt5:
  symbol_map:
    NAS100: USTEC
    JP225: JPN225
    BTCUSD: BTC
    ETHUSD: ETH
  poll_interval_s: 5
ledger:
  path: data/paper_ledger_yolo.sqlite
