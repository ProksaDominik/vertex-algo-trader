# FTMO $10k Challenge portfolio — trimmed to one config per pair for NETTING-mode brokers.
#
# NETTING NOTE:
# IC Markets EU (CySEC) accounts default to Netting mode. In netting, multiple orders
# on the same symbol merge into one position with a shared SL/TP — which breaks any
# strategy that assumes independent positions per config.
# Solution: one config per pair. Cleaner and works everywhere.

capital:
  risk_usd_per_trade: 100
  # Ratchet trailing stop DISABLED (2026-07-17): it was tuned (0.15R start)
  # for the old 0.333R TP, where a trade had little room to run anyway. Now
  # that tp_r_multiple is 2.0 — specifically widened because the backtest
  # showed bigger targets meaningfully improve P&L/drawdown — a 0.15R
  # ratchet closes trades on the first small pullback long before they get
  # anywhere near that target, which directly defeats the point of widening
  # it. The wider-TP result itself was measured WITHOUT a ratchet in the
  # backtest, so running both together live was never actually validated,
  # and it visibly wasn't working right (trades closing at a few dollars of
  # profit with TP 8x further away). 0 disables it.
  trail_start_r: 0.0
  trail_lock_fraction: 0.5
  daily_stop_loss_usd: -400        # buffer before FTMO's -$500 daily limit
  max_total_drawdown_usd: -800     # buffer before FTMO's -$1000 total limit
  max_positions_per_config: 5      # raised from 3 so more concurrent trades can fire per slot
  # Caps total risk exposed to any single currency (incl. XAU) at once,
  # summed across ALL slots — not just one. max_positions_per_config alone
  # doesn't stop many DIFFERENT slots (different pairs, different
  # strategies) from all independently piling into the same currency; a
  # single broad move then hits all of them at once. Seen live more than
  # once (a GBP/CHF cluster, then a broader USD/JPY/GBP cluster) — capped
  # at 3R here specifically because the FTMO goal is passing the challenge
  # (protect the drawdown budget), not squeezing out max correlated size.
  max_currency_exposure_r: 3.0

configs:
  # 1. THE ENGINE — highest expectancy in the sweep at $100 risk.
  #    +$676 est 30d P&L, -$784 DD, 42.62 expect/trade.
  - name: usdjpy_donchian_30m_3r
    symbol: USDJPY
    strategy: DonchianBreakout
    timeframe: 30m
    magic_number: 2001
    strategy_params:
      donchian:
        period: 10  # tightened from 20 so SL/TP sit closer to entry, per explicit request
      exit:
        tp_r_multiple: 2.0  # widened from 0.333 (2026-07-17 sweep): every metric — P&L, expectancy, drawdown — improved monotonically with a bigger target. FTMO doesn't need daily frequency, needs to protect its drawdown budget to pass the challenge, so this leans hard into that tradeoff.
  #    +$455 est 30d, -$840 DD, 13.78 expect/trade.
  - name: xauusd_nowick_30m_3r
    symbol: XAUUSD
    strategy: NoWick
    timeframe: 30m
    magic_number: 2003
    strategy_params:
      trend:
        ema_period: 50
      signal:
        wick_max_pct: 0.05
        body_min_pct: 0.60
      entry:
        retrace_bars: 5
      exit:
        sl_swing_lookback: 5  # tightened from 10 so SL/TP sit closer to entry, per explicit request
        tp_r_multiple: 2.0  # widened from 0.333 (2026-07-17 sweep): every metric — P&L, expectancy, drawdown — improved monotonically with a bigger target. FTMO doesn't need daily frequency, needs to protect its drawdown budget to pass the challenge, so this leans hard into that tradeoff.
  #    +$400 est 30d, -$836 DD, 13.64 expect/trade.
  - name: nzdusd_macd_30m_3r
