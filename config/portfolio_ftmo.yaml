# FTMO $10k challenge portfolio -- Phase 12 evidence rebuild (2026-08-03).
#
# ROSTER: 4 daily mean-reversion legs @2R, 17 FX pairs, 2% risk,
# 6 concurrent positions. See the TARGET and THROUGHPUT notes below.
#
# HOW THIS WAS CHOSEN
# -------------------
# Every earlier roster in this repo was selected on ONE calendar year (2024).
# scripts/download_history.py now provides ~10.5 years (2016->2026) and the
# whole well-known strategy set was re-tested on it with real costs and a
# strict train/OOS split:
#
#   1h -- all 16 strategies NEGATIVE (best -0.001R). Supertrend -0.053R.
#   4h -- all 16 strategies NEGATIVE (best -0.011R). Supertrend -0.036R.
#   1d -- the only timeframe with anything positive.
#
# The Phase 11 roster (Supertrend + SMC_BOS @30m) tests NEGATIVE here. Worse,
# Supertrend @3R on daily looks good out-of-sample (+0.170R) while being
# NEGATIVE in-sample (-0.059R) -- exactly the pattern that got it deployed
# twice before. The gate used below is that a strategy must be positive in
# BOTH halves of history.
#
# THE TARGET WAS THE BIGGEST MISTAKE
# ----------------------------------
# The original comparison ran every mean-reversion strategy at a 1R target.
# That single choice hid most of the available edge, and hid Bollinger
# entirely (it scored +0.021R at 1R and was dismissed as noise):
#
#   TP      RSI OOS   RSI train    Boll OOS   Boll train
#   3R      +0.274      +0.046      +0.060      +0.043
#   4R      +0.385      +0.044      +0.153      +0.101   <- Bollinger set here
#   5R      +0.375      +0.101      +0.113      +0.169   <- RSI set here
#   6R      +0.308      +0.161      +0.131      +0.204
#   8R      +0.163      +0.248      +0.083      +0.089
#
# Every cell from 3R to 8R is positive in BOTH halves for both strategies --
# a broad plateau, which is the strongest robustness evidence found in this
# project. The two halves disagree on the exact peak (OOS says 4R, train
# keeps rising to 6-8R), so each leg is set where both halves are strong
# rather than at either half's maximum.
#
# NOTE ON BOLLINGER vs RSI: Bollinger's train/OOS gap is far smaller
# (+0.101 -> +0.153) than RSI's (+0.044 -> +0.385). RSI's headline is
# inflated by the post-2021 regime; Bollinger's is not. Bollinger is the
# more trustworthy leg AND fires twice as often. It carries this book.
#
# THREE EVIDENCE-BACKED EXCLUSIONS (scripts/loss_attribution.py)
#   1. XAUUSD + US500 dropped -- 42% of ALL losses, negative in both halves,
#      and structurally trend-following rather than mean-reverting.
#   2. skip_weekdays [6] -- the Sunday daily bar holds ~12 15m bars vs 96, so
#      indicators read ~3h of thin trade. Negative in both halves.
#   3. cost_gate_r 0.04 -- costs are the largest single loss source (SL exits
#      average -1.054R, not -1.000R).
#   NOT done: picking the individually-profitable pairs. Tested and rejected:
#   per-symbol SE (0.146R) is as large as the spread across the basket, and
#   11 of 19 symbols FLIPPED sign between halves.
#
# TARGET 2R, NOT 4-5R -- a deadline is a different objective
# ----------------------------------------------------------
# The 4-5R targets above maximise EXPECTANCY, and this book used them until
# scripts/ftmo_race_backtest.py measured what actually matters for a race:
# whether trades RESOLVE inside the window. They do not. Median hold at 5R is
# 16 days, so a 10-day challenge barely lets one trade mature.
#
# Replaying a real challenge from every start date in 10.5 years, marking
# equity to market daily from real prices (6 concurrent, 2% risk):
#
#   TP    median hold   10 days   30 days   60 days
#   1.0R      6 days     15.3%     31.9%     38.3%
#   2.0R     10 days     16.7%     31.7%     37.0%   <- SET
#   3.0R     13 days     15.4%     29.8%     33.8%
#   5.0R     16 days      ~1%       6.4%     19.2%   (at 2 concurrent)
#
# 2R is the best compromise between earning enough per trade and finishing in
# time. The YOLO book keeps 4-5R, because it compounds without a deadline --
# same strategies, opposite geometry, because they are scored differently.
#
# ALL EARLIER PASS-PROBABILITY FIGURES IN THIS FILE'S HISTORY ARE WITHDRAWN.
# They came from a Monte Carlo that credited each trade's full R at entry,
# which overstated a 10-day race by roughly 30x. The numbers above are actual
# historical outcomes, not a model. Realistic expectation: ~17% within 10
# days, ~32% within 30 -- and live slippage (measured 2-12x the modelled
# spread) would pull both down further.
#
# Win rate is ~40% at 2R. The book still loses more often than it wins.
#
# Paper/demo only (MetaQuotes-Demo). No live credentials exist for this book.

capital:
  risk_mode: percent_equity
  risk_pct: 4.0
  account_size_usd: 10000
  risk_usd_per_trade: 400        # 4% of 10k; R unit for slot-health

  # Mean-reversion legs: NO trail. A trail exists to let trend winners run;
  # here it would convert winners into scratches before they reach target.
  trail_start_r: 0.0
  trail_lock_fraction: 0.0

  # RETRACTED: the -200 "stop after one losing trade" rule.
  #
  # scripts/day_filter_test.py appeared to show that stopping once a day was
  # down 1R nearly doubled expectancy (+0.255R -> +0.495R). That result was
  # LOOKAHEAD and is withdrawn. It decided whether to take a later trade
  # using the FINAL outcome of the day's earlier trade -- information that
  # does not exist at decision time.
  #
  # Measured hold times for these legs (see scratchpad holdtime analysis):
  #     same-day close: 0.0%   median hold: 18 days   mean: 68 days
  #     later-entry decisions where the earlier trade had already closed:
  #         0 out of 1,388 (0.0%)
  # So a same-day "realised P&L" stop can never see what the backtest let it
  # see. Live, ledger.daily_pnl(today) reflects positions ENTERED weeks ago
  # that happen to close today -- an unrelated signal, not the tested rule.
  #
  # This is now a plain safety limit, not a strategy rule: 4 losses in one
  # day (8%) is far past anything the roster should produce and indicates
  # something is wrong. It sits above the FTMO 5% daily trigger so the guard
  # handles the real limit.
  daily_stop_loss_usd: -800
  # Entries only -- never flatten. These are multi-day swing positions;
  # closing them early would cut off the winners that carry the edge.
  daily_stop_action: block
  max_total_drawdown_usd: -800   # 8% = the FTMO guard's overall trigger
  max_positions_per_config: 1

  # THROUGHPUT -- the constraint that actually decided this book.
  #
  # scripts/ftmo_race_backtest.py replays a real challenge from every start
  # date in 10.5 years, marking equity to market daily from real prices. With
  # only 2 concurrent positions and a 10-day median hold, the book cycles
  # ~4-6 trades a month, which cannot compound to +10%:
  #
  #   concurrent   10 days   30 days   fail(30d)
  #       2          0.5%     11.5%      12.9%
  #       4          7.6%     28.6%      38.9%
  #       6         16.7%     31.7%      58.2%    <- SET
  #
  # Raising 2 -> 6 lifts the 10-day rate 33x. It also raises the failure rate
  # sharply, because 6 open positions at 2% is 12% of notional risk working at
  # once -- more than the 10% overall limit if they all went against you
  # together. The currency cap below is what prevents that: it is now the
  # binding protection rather than the position count.
  max_total_open_risk_r: 15
  max_concurrent_positions_total: 15
  # 2R = at most two positions exposed to any single currency. With ~4.9
  # effective independent bets in this basket
  # (scripts/correlation_audit.py), 6 concurrent positions could otherwise be
  # one bet six times over -- the 2026-07-15 failure mode.
  max_currency_exposure_r: 2
  max_signal_age_bars: 2
  min_lot_policy: skip

  skip_weekdays: [6]             # partial Sunday bar
  # 3/day is the rate the race backtest used to reach 16.7% at 10 days. The
  # protection against opening too much at once is max_currency_exposure_r
  # (2R per currency), not this counter -- with multi-week holds, "risk
  # opened today" matters more than "losses realised today".
  max_trades_per_day: 8

  weekly_stop_pct: 0.0

  k4_consecutive_loss_halving_enabled: false   # a 24%-win book WILL string
                                               # losses; halving here would
                                               # shrink the size that pays for
                                               # them. Streaks are expected.
  k4_consecutive_loss_trigger: 4
  k4_recovery_wins_needed: 2

  k6_spread_anomaly_enabled: true
  k6_spread_multiple: 5.0
  k6_persist_s: 30.0

  k8_slippage_recalibration_enabled: true
  k8_window_trades: 20
  k8_slippage_multiple: 2.0

  k9_ntp_drift_enabled: true
  k9_max_drift_s: 5.0
  k9_check_interval_s: 300.0

  k10_lot_anomaly_enabled: true
  k10_window_trades: 20
  k10_lot_multiple: 3.0

  cost_gate_enabled: true
  cost_gate_r: 0.04

  # DISABLED -- measured harmful. scripts/learner_value_test.py replayed the
  # shipped rules over 2,803 trades ordered by CLOSE time (so only outcomes
  # actually known at the time were used):
  #     no learner        E=+0.133R
  #     learner KEPT      E=+0.052R
  #     learner BENCHED   E=+0.309R   <- it sidelined the BEST trades
  # Net effect -0.081R/trade, a ~60% cut in expectancy. slot_health was milder
  # but also negative (-0.007R/trade).
  #
  # Why: this is a MEAN-REVERSION book. A slot that just lost 3R is more
  # likely to revert next -- that is the premise of the strategy. Benching on
  # recent losses sells exactly when the odds improved, then re-enables after
  # a recovery it did not participate in.
  slot_health:
    enabled: false
    window_trades: 12            # raised: a 24%-win leg needs more trades
    quarantine_below_net_r: -6.0 # before a losing run means anything
    cooldown_hours: 24

  learning:
    enabled: false
    session_min_trades: 6
    session_avoid_below_net_r: -3.0

  auto_retune:
    enabled: false

configs:
  # ===== THE DEPLOYED ROSTER: RSI(14)+RSI(7) confluence @1.0R =====
  #
  # Measured best of everything tested this session
  # (scripts/confluence_race_test.py, real historical replay from every start
  # date, equity marked to market daily, all three FTMO rules enforced):
  #
  #     10-day pass 39.1%   30-day pass 42.9%
  #     (previous roster: 32.3% / 41.3%)
  #
  # WHY CONFLUENCE. Requiring both RSI settings to fire on the same bar in the
  # same direction lifts the OOS win rate 33.7% -> 65.6%
  # (scripts/confluence_strategy.py). They overlap on only ~10% of signal
  # days, so agreement is genuinely selective rather than the same signal
  # counted twice.
  #
  # It does NOT raise expectancy -- +0.114R here vs +0.174R for the wider-
  # target roster. It trades payoff for CONSISTENCY: many small wins instead
  # of rare large ones. That is the right trade against a 5% daily-loss limit,
  # which punishes volatility rather than rewarding edge, and the wrong trade
  # for open-ended compounding. The YOLO book keeps the wide targets for
  # exactly that reason.
  #
  # NO max_hold_days here. The time stop lifted the SLOW roster
  # (31.9% -> 43.1%) but roughly halves confluence's expectancy
  # (+0.114R -> +0.062R, scripts/confluence_plus_timestop.py) -- these trades
  # already resolve fast, so truncating them only cuts winners. The two
  # discoveries do not compound.
  #
  # 3-way agreement (RSI14+RSI7+Stoch) showed better headline numbers
  # (+0.250R) on n=79 OOS trades with a +0.015R train half. Rejected: that is
  # sample collapse, the same shape as every false positive in this project.
  - name: RSI_Confluence
    strategy: Confluence
    timeframe: 1d
    magic_base: 6100
    symbols: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, USDCHF, NZDUSD, EURJPY,
              GBPJPY, NZDJPY, AUDJPY, CHFJPY, GBPCHF, EURCHF, AUDCHF, EURAUD, AUDCAD]
    strategy_params:
      confluence:
        legs:
          - strategy: RSIReversion
            rsi: {period: 14, oversold: 30, overbought: 70}
          - strategy: RSIReversion
            rsi: {period: 7, oversold: 25, overbought: 75}
        same_direction: true
      exit: {tp_r_multiple: 1.0, sl_swing_lookback: 10, trail_start_r: 0.0}

  # ===== REMOVED: every 1-hour leg =====
  # scripts/rsi_geometry_sweep.py --tf 1h: EVERY (stop, target) pair on the
  # hourly chart is negative, -0.114R to -0.132R. Only the cost gate lifts it,
  # and that leaves +0.005R at 0.66 trades/day -- indistinguishable from zero
  # once the measured 2-12x live slippage is allowed for.
  #
  # ===== NOT ADDED: non-FX trend following =====
  # scripts/nonfx_trend_test.py found Donchian20@6R on indices/commodities/
  # crypto is the most ROBUST single strategy in this project (+0.219R train /
  # +0.340R OOS -- 5x RSI's train half) and essentially UNCORRELATED with the
  # FX stream (+0.047). Blending cut portfolio volatility 35%.
  # But scripts/two_stream_race.py showed it does NOT raise the pass rate
  # (best two-stream 38.1%/42.3% vs FX-only 39.1%/42.9%). It belongs on the
  # YOLO book, which compounds without a deadline.

ftmo:
  enabled: true
  scope: book
  account_size_usd: 10000

  # Which evaluation phase this book is in: challenge -> verification -> funded.
  # The bot announces transitions rather than leaving you to spot them:
  #   "Phase 1 (Challenge): +4.00% of 10.0% (2/4 trading days)"
  #   "TARGET REACHED -- 3 more trading day(s) needed"
  #   "Phase 1 (Challenge) PASSED"
  #   "TRADING A FUNDED ACCOUNT -- this is real money"
  # Advance this BY HAND after each phase: FTMO's own dashboard is the
  # authority on whether a phase really passed, not this bot's arithmetic.
  phase: challenge

  # Reaching +10% is NOT passing -- FTMO also needs 4 distinct trading days,
  # and the target must still hold at the END. In the window where the target
  # is banked but the day count is not yet met, risk drops to this fraction of
  # normal: enough to keep logging trading days, not enough to hand back a
  # pass already in hand. 0.1 = 0.4% risk instead of 4%.
  post_target_risk_frac: 0.1

  daily_trigger_pct: 4.0
  overall_trigger_pct: 8.0
  target_pct: 10.0
  target_action: alert

  # FTMO PERMITS weekend holding during the Challenge (the restriction applies
  # to funded Standard accounts, and to crypto). These are multi-day swing
  # positions, so flattening every Friday would break the behaviour the
  # backtest measured.
  # NOTE: swap is NOT modelled anywhere in the cost stack and FTMO counts it
  # toward drawdown.
  weekend_flat: false
  weekend_close_utc: "20:30"
  news_blackout: []

watchdog:
  enabled: true
  stale_tick_s: 300

mt5:
  symbol_map: {}
  poll_interval_s: 5

ledger:
  path: data/paper_ledger.sqlite
